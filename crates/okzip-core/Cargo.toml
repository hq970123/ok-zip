[package]
name = "okzip-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Platform-independent archive engine for OK Zip"

[features]
default = ["rar"]
rar = ["dep:rars"]

[dependencies]
zip = "9"
sevenz-rust2 = "0.25"
# Pure-Rust RAR 1.3–7 reader (Apache-2.0); `encryption` = AES for RAR 3/4/5.
rars = { version = "0.12", default-features = false, features = ["encryption"], optional = true }
tar = "0.4"
flate2 = "1"
bzip2 = "0.6"
liblzma = "0.4"
zstd = "0.14"
thiserror = "2"
walkdir = "2"
filetime = "0.2"
crc32fast = "1"
encoding_rs = "0.8"
time = { version = "0.3", features = ["local-offset"] }

[dev-dependencies]
tempfile = "3"
