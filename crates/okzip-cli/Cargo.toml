[package]
name = "okzip-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line front end for okzip-core"

[[bin]]
name = "okzip-cli"
path = "src/main.rs"

[features]
default = ["rar"]
rar = ["okzip-core/rar"]

[dependencies]
okzip-core = { path = "../okzip-core", default-features = false }
