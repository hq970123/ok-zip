name: screenshots

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  screenshots:
    name: GUI smoke test + screenshots
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release --locked --target x86_64-pc-windows-msvc -p okzip -p okzip-cli

      - name: Smoke test + capture screenshots
        shell: pwsh
        run: ./.github/scripts/screenshots.ps1 -Bin target/x86_64-pc-windows-msvc/release -Out shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/
          if-no-files-found: warn
